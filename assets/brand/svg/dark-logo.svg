<svg width="460" height="112" viewBox="0 0 460 112" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
  <title id="title">Thunder Spark logo for dark backgrounds</title>
  <desc id="desc">Thunder Spark lockup with lightning-circle symbol and Orbitron wordmark.</desc>
  <defs>
    <filter id="dark-glow" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.05 0 0 0 0 0.73 0 0 0 0 1 0 0 0 .85 0" result="cyan"/>
      <feMerge><feMergeNode in="cyan"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="dark-bolt" x1="62" y1="18" x2="184" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".36" stop-color="#BFF7FF"/>
      <stop offset=".66" stop-color="#36CCFF"/>
      <stop offset="1" stop-color="#087BFF"/>
    </linearGradient>
    <linearGradient id="dark-ring" x1="40" y1="34" x2="216" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".22" stop-color="#7BE7FF"/>
      <stop offset=".58" stop-color="#00A8FF"/>
      <stop offset="1" stop-color="#0B4DFF"/>
    </linearGradient>
    <linearGradient id="dark-metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".22" stop-color="#EFF6FF"/>
      <stop offset=".45" stop-color="#93ABC5"/>
      <stop offset=".58" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#5FCFFF"/>
    </linearGradient>
    <linearGradient id="dark-spark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EAF8FF"/>
      <stop offset=".46" stop-color="#7BE7FF"/>
      <stop offset="1" stop-color="#0A8BFF"/>
    </linearGradient>
    <radialGradient id="dark-aura" cx="50%" cy="48%" r="58%">
      <stop offset="0" stop-color="#16D8FF" stop-opacity=".5"/>
      <stop offset=".55" stop-color="#2D9CFF" stop-opacity=".18"/>
      <stop offset="1" stop-color="#040813" stop-opacity="0"/>
    </radialGradient>
    <style>@font-face{font-family:Orbitron;src:url('../../../src/assets/webfonts/orbitron/orbitron-latin-900-normal.woff2') format('woff2');font-weight:900;font-style:normal;font-display:swap}.word{font-family:Orbitron,Inter,'Segoe UI',sans-serif;font-weight:900;font-style:italic;letter-spacing:.035em}.tag{font-family:Orbitron,Inter,'Segoe UI',sans-serif;font-weight:800;font-style:italic;letter-spacing:.08em}</style>
  </defs>
  <rect width="460" height="112" rx="26" fill="#050914"/><rect x="8" y="8" width="444" height="96" rx="20" fill="none" stroke="#85C9FF" stroke-opacity=".16"/>
  <g transform="translate(4.479999999999997 12.479999999999997) scale(0.34)" filter="url(#dark-glow)">
    <circle cx="128" cy="128" r="111" fill="url(#dark-aura)"/>
    <path d="M182 41a91 91 0 1 0 38 86" fill="none" stroke="url(#dark-ring)" stroke-width="12" stroke-linecap="round" stroke-dasharray="410 58"/>
    <path d="M146.5 21 61.5 144h55.5l-18.5 86 98-113h-58z" fill="#03101F" opacity=".62" transform="translate(8 9)"/>
    <path d="M146.5 21 61.5 144h55.5l-18.5 86 98-113h-58z" fill="url(#dark-bolt)"/>
    <path d="M146.5 21 61.5 144h55.5l-18.5 86 98-113h-58z" fill="none" stroke="#DDF9FF" stroke-width="3" opacity=".7"/>
  </g>
  <text class="word" x="108" y="56" fill="url(#dark-metal)" font-size="25">THUNDER</text>
  <text class="word" x="108" y="84" fill="url(#dark-spark)" font-size="25">SPARK</text>
  <rect x="372" y="65" width="58" height="22" rx="7" fill="none" stroke="#16D8FF" stroke-width="2" opacity=".88"/>
  <text class="tag" x="383" y="81" fill="#85C9FF" font-size="13">1.6.0</text>
</svg>
