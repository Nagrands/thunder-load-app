<svg width="760" height="220" viewBox="0 0 760 220" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
  <title id="title">Thunder Spark main logo</title>
  <desc id="desc">Thunder Spark lockup with electric lightning-circle symbol, Orbitron wordmark, version chip, and slogan.</desc>
  <defs>
    <filter id="main-glow" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.05 0 0 0 0 0.73 0 0 0 0 1 0 0 0 .85 0" result="cyan"/>
      <feMerge><feMergeNode in="cyan"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="main-bolt" x1="62" y1="18" x2="184" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".36" stop-color="#BFF7FF"/>
      <stop offset=".66" stop-color="#36CCFF"/>
      <stop offset="1" stop-color="#087BFF"/>
    </linearGradient>
    <linearGradient id="main-ring" x1="40" y1="34" x2="216" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".22" stop-color="#7BE7FF"/>
      <stop offset=".58" stop-color="#00A8FF"/>
      <stop offset="1" stop-color="#0B4DFF"/>
    </linearGradient>
    <linearGradient id="main-metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".22" stop-color="#EFF6FF"/>
      <stop offset=".45" stop-color="#93ABC5"/>
      <stop offset=".58" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#5FCFFF"/>
    </linearGradient>
    <linearGradient id="main-spark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EAF8FF"/>
      <stop offset=".46" stop-color="#7BE7FF"/>
      <stop offset="1" stop-color="#0A8BFF"/>
    </linearGradient>
    <radialGradient id="main-aura" cx="50%" cy="48%" r="58%">
      <stop offset="0" stop-color="#16D8FF" stop-opacity=".5"/>
      <stop offset=".55" stop-color="#2D9CFF" stop-opacity=".18"/>
      <stop offset="1" stop-color="#040813" stop-opacity="0"/>
    </radialGradient>
    <style>@font-face{font-family:Orbitron;src:url('../../../src/assets/webfonts/orbitron/orbitron-latin-900-normal.woff2') format('woff2');font-weight:900;font-style:normal;font-display:swap}.word{font-family:Orbitron,Inter,'Segoe UI',sans-serif;font-weight:900;font-style:italic;letter-spacing:.035em}.tag{font-family:Orbitron,Inter,'Segoe UI',sans-serif;font-weight:800;font-style:italic;letter-spacing:.08em}</style>
  </defs>
  <rect width="760" height="220" rx="30" fill="#050914"/>
  <rect x="10" y="10" width="740" height="200" rx="24" fill="none" stroke="#85C9FF" stroke-opacity=".16"/>
  <circle cx="555" cy="26" r="92" fill="#16D8FF" opacity=".11" filter="url(#main-glow)"/>
  <g transform="translate(18.239999999999995 18.239999999999995) scale(0.67)" filter="url(#main-glow)">
    <circle cx="128" cy="128" r="111" fill="url(#main-aura)"/>
    <path d="M182 41a91 91 0 1 0 38 86" fill="none" stroke="url(#main-ring)" stroke-width="12" stroke-linecap="round" stroke-dasharray="410 58"/>
    <path d="M146.5 21 61.5 144h55.5l-18.5 86 98-113h-58z" fill="#03101F" opacity=".62" transform="translate(8 9)"/>
    <path d="M146.5 21 61.5 144h55.5l-18.5 86 98-113h-58z" fill="url(#main-bolt)"/>
    <path d="M146.5 21 61.5 144h55.5l-18.5 86 98-113h-58z" fill="none" stroke="#DDF9FF" stroke-width="3" opacity=".7"/>
  </g>
  <text class="word" x="220" y="82" fill="url(#main-metal)" font-size="52">THUNDER</text>
  <text class="word" x="220" y="138" fill="url(#main-spark)" font-size="55">SPARK</text>
  <rect x="536" y="105" width="76" height="28" rx="9" fill="none" stroke="#16D8FF" stroke-width="2" opacity=".88"/>
  <text class="tag" x="550" y="125" fill="#85C9FF" font-size="17">1.6.0</text>
  <line x1="220" y1="162" x2="558" y2="162" stroke="#2D9CFF" stroke-width="2" opacity=".46"/>
  <text x="220" y="194" fill="#F8FBFF" font-family="Orbitron,Inter,'Segoe UI',sans-serif" font-size="18" font-style="italic" font-weight="600"><tspan fill="#16D8FF">Spark</tspan> ignites the future of downloads.</text>
</svg>
