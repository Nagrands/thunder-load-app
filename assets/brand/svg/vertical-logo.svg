<svg width="260" height="328" viewBox="0 0 260 328" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
  <title id="title">Thunder Spark vertical logo</title>
  <desc id="desc">Vertical Thunder Spark lockup with electric symbol and Orbitron wordmark.</desc>
  <defs>
    <filter id="vertical-glow" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.05 0 0 0 0 0.73 0 0 0 0 1 0 0 0 .85 0" result="cyan"/>
      <feMerge><feMergeNode in="cyan"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="vertical-bolt" x1="62" y1="18" x2="184" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".36" stop-color="#BFF7FF"/>
      <stop offset=".66" stop-color="#36CCFF"/>
      <stop offset="1" stop-color="#087BFF"/>
    </linearGradient>
    <linearGradient id="vertical-ring" x1="40" y1="34" x2="216" y2="224" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".22" stop-color="#7BE7FF"/>
      <stop offset=".58" stop-color="#00A8FF"/>
      <stop offset="1" stop-color="#0B4DFF"/>
    </linearGradient>
    <linearGradient id="vertical-metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".22" stop-color="#EFF6FF"/>
      <stop offset=".45" stop-color="#93ABC5"/>
      <stop offset=".58" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#5FCFFF"/>
    </linearGradient>
    <linearGradient id="vertical-spark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EAF8FF"/>
      <stop offset=".46" stop-color="#7BE7FF"/>
      <stop offset="1" stop-color="#0A8BFF"/>
    </linearGradient>
    <radialGradient id="vertical-aura" cx="50%" cy="48%" r="58%">
      <stop offset="0" stop-color="#16D8FF" stop-opacity=".5"/>
      <stop offset=".55" stop-color="#2D9CFF" stop-opacity=".18"/>
      <stop offset="1" stop-color="#040813" stop-opacity="0"/>
    </radialGradient>
    <style>@font-face{font-family:Orbitron;src:url('../../../src/assets/webfonts/orbitron/orbitron-latin-900-normal.woff2') format('woff2');font-weight:900;font-style:normal;font-display:swap}.word{font-family:Orbitron,Inter,'Segoe UI',sans-serif;font-weight:900;font-style:italic;letter-spacing:.035em}.tag{font-family:Orbitron,Inter,'Segoe UI',sans-serif;font-weight:800;font-style:italic;letter-spacing:.08em}</style>
  </defs>
  <rect width="260" height="328" rx="44" fill="#050914"/>
  <rect x="10" y="10" width="240" height="308" rx="36" fill="none" stroke="#85C9FF" stroke-opacity=".18"/>
  <g transform="translate(45.519999999999996 37.519999999999996) scale(0.66)" filter="url(#vertical-glow)">
    <circle cx="128" cy="128" r="111" fill="url(#vertical-aura)"/>
    <path d="M182 41a91 91 0 1 0 38 86" fill="none" stroke="url(#vertical-ring)" stroke-width="12" stroke-linecap="round" stroke-dasharray="410 58"/>
    <path d="M151 16 58 148h58l-18 92 100-139h-61z" fill="#03101F" opacity=".62" transform="translate(8 9)"/>
    <path d="M151 16 58 148h58l-18 92 100-139h-61z" fill="url(#vertical-bolt)"/>
    <path d="M151 16 58 148h58l-18 92 100-139h-61z" fill="none" stroke="#DDF9FF" stroke-width="3" opacity=".7"/>
  </g>
  <text class="word" x="130" y="242" text-anchor="middle" fill="url(#vertical-metal)" font-size="31">THUNDER</text>
  <text class="word" x="130" y="279" text-anchor="middle" fill="url(#vertical-spark)" font-size="34">SPARK</text>
  <rect x="99" y="292" width="62" height="21" rx="7" fill="none" stroke="#16D8FF" stroke-width="2" opacity=".86"/>
  <text class="tag" x="112" y="307" fill="#85C9FF" font-size="12">1.6.0</text>
</svg>
